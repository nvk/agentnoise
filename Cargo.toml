[package]
name = "agentnoise"
version = "0.2.0"
edition = "2024"
description = "Chat with local coding agents through Marmot / Darkmatter"
homepage = "https://agentnoise.com"
repository = "https://github.com/nvk/agentnoise"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
dirs = "6.0.0"
hex = "0.4"
hmac = "0.12.1"
nostr = "0.44.2"
qrcode = "0.14.1"
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zeroize = "1.8.2"

# Darkmatter (v2 Marmot) protocol stack. Pinned by git rev so agentnoise builds
# from a clean checkout without a sibling darkmatter repo.
marmot-app = { version = "0.1.0", git = "https://github.com/marmot-protocol/darkmatter.git", rev = "53928f9f3d0b1ab375e72f8e6c6dbc72fed41013" }
marmot-account = { version = "0.1.0", git = "https://github.com/marmot-protocol/darkmatter.git", rev = "53928f9f3d0b1ab375e72f8e6c6dbc72fed41013" }
cgka-traits = { version = "0.1.0", git = "https://github.com/marmot-protocol/darkmatter.git", rev = "53928f9f3d0b1ab375e72f8e6c6dbc72fed41013" }
transport-quic-broker = { version = "0.1.0", git = "https://github.com/marmot-protocol/darkmatter.git", rev = "53928f9f3d0b1ab375e72f8e6c6dbc72fed41013" }
transport-quic-stream = { version = "0.1.0", git = "https://github.com/marmot-protocol/darkmatter.git", rev = "53928f9f3d0b1ab375e72f8e6c6dbc72fed41013" }
# In-process Nostr relay used by `agentnoise fake-phone roundtrip` to drive a
# fully-local dual-runtime smoke test without external infrastructure.
nostr-relay-builder = "0.44"

[dev-dependencies]
# tempfile promoted to a regular dep above so the fake-phone harness can use it.

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = [
    "linux-native-sync-persistent",
    "crypto-rust",
] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
